services:
  - type: web
    name: solestyle-calzado
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python setup_admin.py && gunicorn app:app
    envVars:
      - key: MONGO_URI
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: MONGO_DB
        value: solestyle_calzado
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
