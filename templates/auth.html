{% extends 'base.html' %}{% block content %}<div class="auth-card panel mx-auto"><div class="eyebrow">SOLESTYLE</div><h1 class="mb-4">{{'Crear cuenta' if registro else 'Iniciar sesión'}}</h1><form method="post">{% if registro %}<label class="form-label">Nombre</label><input name="nombre" class="form-control mb-3" required maxlength="80">{% endif %}<label class="form-label">Correo</label><input name="correo" type="email" class="form-control mb-3" required><label class="form-label">Contraseña</label><input name="clave" type="password" class="form-control mb-4" required minlength="8"><button class="btn btn-accent w-100">{{'Registrarme' if registro else 'Ingresar'}}</button></form><p class="mt-3">{% if registro %}<a href="{{url_for('login')}}">Ya tengo cuenta</a>{% else %}<a href="{{url_for('registro')}}">Crear una cuenta nueva</a>{% endif %}</p></div>{% endblock %}
