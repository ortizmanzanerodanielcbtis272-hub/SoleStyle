{% extends 'base.html' %}{% block content %}<div class="panel mx-auto" style="max-width:700px"><h1>{{'Editar calzado' if p else 'Nuevo calzado'}}</h1><form method="post"><div class="row g-3"><div class="col-md-8"><label class="form-label">Nombre</label><input name="nombre" class="form-control" value="{{p.nombre if p else ''}}" required></div><div class="col-md-4"><label class="form-label">Categoría</label><select name="categoria" class="form-select">{% for cat in ['Tenis','Casual','Deportivo','Botas','Formal','Sandalias'] %}<option {% if p and p.categoria==cat %}selected{% endif %}>{{cat}}</option>{% endfor %}</select></div><div class="col-md-4"><label class="form-label">Talla</label><input name="talla" class="form-control" value="{{p.talla if p else ''}}" required></div><div class="col-md-4"><label class="form-label">Precio MXN</label><input type="number" step="0.01" min="0.01" name="precio" class="form-control" value="{{p.precio if p else ''}}" required></div><div class="col-md-4"><label class="form-label">Existencias</label><input type="number" min="0" name="existencias" class="form-control" value="{{p.existencias if p else 0}}" required></div><div class="col-12"><label class="form-label">Descripción</label><textarea name="descripcion" class="form-control">{{p.descripcion if p else ''}}</textarea></div><div class="col-12"><label class="form-label">URL de imagen (opcional)</label><input name="imagen" type="url" class="form-control" value="{{p.imagen if p else ''}}"></div></div><button class="btn btn-accent mt-4">Guardar</button> <a href="{{url_for('admin')}}" class="btn btn-outline-light mt-4">Volver</a></form></div>{% endblock %}
